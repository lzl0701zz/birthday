<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>展信安 · 徐静 22 岁</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --paper:#fdf9f4;
    --pink:#f5b3c4;
    --hot:#d97898;
    --yellow:#f2dda0;
    --mint:#b9dfd0;
    --sky:#b9d3ee;
    --lilac:#cfbce8;
    --ink:#584a52;
    --ink-mid:#877580;
    --ink-soft:#a9999f;
    --serif:"Source Han Serif SC","Source Han Serif CN","Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",Georgia,serif;
  }
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 12% 14%, rgba(245,179,196,.26), transparent 44%),
      radial-gradient(circle at 88% 10%, rgba(185,211,238,.28), transparent 42%),
      radial-gradient(circle at 82% 86%, rgba(242,221,160,.32), transparent 46%),
      radial-gradient(circle at 6% 90%, rgba(207,188,232,.28), transparent 44%),
      radial-gradient(rgba(230,215,225,.55) 1px, transparent 1px);
    background-size:auto,auto,auto,auto,28px 28px;
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--serif);
    font-size:16px;
    line-height:1.9;
    min-height:100vh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #floaters{position:fixed;inset:0;z-index:0;pointer-events:none}

  .music-btn{
    position:fixed;top:16px;right:16px;z-index:50;
    width:48px;height:48px;border-radius:16px;
    border:1.5px solid #fff;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--hot);font-size:1.1rem;cursor:pointer;
    display:grid;place-items:center;transition:.3s;
    box-shadow:0 10px 22px -14px rgba(160,110,140,.9);
    font-family:var(--serif);
  }
  .music-btn:hover{transform:translateY(-2px)}
  .music-btn.on{
    background:linear-gradient(140deg,#f5b3c4,#cfbce8);
    color:#fff;box-shadow:0 0 24px rgba(217,120,152,.45);
  }

  .hero{
    position:relative;z-index:1;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    text-align:center;padding:80px 20px 90px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--pink);
    color:var(--hot);font-size:.72rem;
    letter-spacing:.3em;text-indent:.3em;
    padding:8px 20px;border-radius:999px;
    box-shadow:0 10px 20px -16px rgba(217,120,152,.9);
    margin-bottom:32px;
  }
  .hero h1{
    font-size:clamp(2.5rem,13.5vw,6.5rem);
    font-weight:700;line-height:1.16;letter-spacing:.14em;
    text-indent:.14em;
    background:linear-gradient(100deg,#dd8fa8,#d8a86e,#8fbfae,#9ab8d6,#b49dd0,#dd8fa8);
    background-size:300% 300%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    animation:shimmer 11s ease infinite;
    filter:drop-shadow(0 10px 22px rgba(217,120,152,.18));
  }
  @keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .sub{
    margin-top:28px;font-size:clamp(.92rem,3.2vw,1.12rem);
    color:var(--ink-mid);letter-spacing:.2em;text-indent:.2em;
  }
  .sub b{color:var(--hot);font-size:1.3em;font-weight:700;letter-spacing:0}
  .date-card{
    margin-top:32px;
    display:inline-flex;align-items:center;gap:16px;
    background:#fff;border-radius:18px;
    padding:12px 24px;
    border:1px dashed var(--pink);
    box-shadow:0 14px 30px -22px rgba(160,110,140,.95);
  }
  .date-card .num{
    font-size:1.5rem;font-weight:700;letter-spacing:.12em;
    color:var(--hot);
  }
  .date-card .wk{
    font-size:.76rem;color:var(--ink-soft);letter-spacing:.18em;
    border-left:1px dotted var(--pink);padding-left:14px;
  }
  .scroll-hint{
    position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
    color:var(--pink);font-size:1.2rem;
    animation:bounce 2s ease-in-out infinite;
  }
  @keyframes bounce{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}

  .section{
    max-width:980px;margin:0 auto;padding:76px 20px;
    position:relative;z-index:1;
  }
  .section-title{
    font-size:clamp(1.45rem,4.4vw,2.1rem);font-weight:700;
    text-align:center;letter-spacing:.22em;text-indent:.22em;
    margin-bottom:14px;
    background:linear-gradient(100deg,#dd8fa8,#d8a86e,#8fbfae,#9ab8d6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .section-title .deco{
    font-size:.62em;opacity:.75;margin:0 .1em;
    -webkit-text-fill-color:var(--pink);
  }
  .section-sub{
    text-align:center;color:var(--ink-soft);
    font-size:.82rem;margin-bottom:44px;
    letter-spacing:.14em;text-indent:.14em;
  }
  .rule{
    width:46px;height:1px;margin:0 auto 40px;
    background:linear-gradient(90deg,transparent,var(--pink),transparent);
  }

  .cake-wrap{
    display:flex;justify-content:center;padding:14px 0 6px;
  }
  .cake{
    display:flex;flex-direction:column;align-items:center;
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
    transition:transform .35s ease;
  }
  .cake:hover{transform:translateY(-4px) scale(1.015)}
  .candles{
    display:flex;gap:14px;align-items:flex-end;
    margin-bottom:-6px;position:relative;z-index:3;
  }
  .candle{
    position:relative;width:10px;height:40px;border-radius:5px;
    background:repeating-linear-gradient(45deg,#fff 0 4px,#f5b3c4 4px 8px);
    box-shadow:0 3px 8px rgba(160,110,140,.3);
  }
  .candle:nth-child(2n){background:repeating-linear-gradient(45deg,#fff 0 4px,#b9d3ee 4px 8px)}
  .candle:nth-child(3n){background:repeating-linear-gradient(45deg,#fff 0 4px,#cfbce8 4px 8px)}
  .flame{
    position:absolute;left:50%;bottom:100%;width:12px;height:19px;
    transform:translate(-50%,3px);
    border-radius:50% 50% 36% 36% / 62% 62% 40% 40%;
    background:radial-gradient(circle at 50% 72%,#fffdf0 0%,#f4d97a 42%,#eab069 74%,rgba(234,176,105,0) 78%);
    filter:drop-shadow(0 0 8px #f0cf7a);
    animation:flicker .34s infinite alternate;
    transition:opacity .35s ease, transform .35s ease;
  }
  @keyframes flicker{
    from{transform:translate(-50%,3px) scaleY(.9) scaleX(1.06)}
    to  {transform:translate(-50%,0)   scaleY(1.07) scaleX(.94)}
  }
  .flame.out{animation:none;opacity:0;transform:translate(-50%,5px) scale(.15)}

  .tier{position:relative;flex-shrink:0;border-radius:12px 12px 9px 9px}
  .tier.top{
    width:148px;height:48px;
    background:linear-gradient(180deg,#fff3f6,#f8c6d4);
    box-shadow:inset 0 -10px 18px rgba(217,120,152,.22),0 8px 18px -12px rgba(160,110,140,.9);
  }
  .tier.mid{
    width:198px;height:56px;margin-top:-4px;
    background:linear-gradient(180deg,#fffbf2,#f5e2b3);
    box-shadow:inset 0 -12px 20px rgba(214,176,105,.22),0 8px 18px -12px rgba(160,110,140,.7);
  }
  .tier.bottom{
    width:248px;height:62px;margin-top:-4px;
    background:linear-gradient(180deg,#f9f4ff,#dccbee);
    box-shadow:inset 0 -14px 22px rgba(160,130,200,.22),0 8px 18px -12px rgba(160,110,140,.6);
  }
  .tier.top::after,.tier.mid::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
  }
  .tier.top::after{
    background-image:
      radial-gradient(circle at 22% 58%, #fff 2.6px, transparent 3.6px),
      radial-gradient(circle at 46% 34%, #f2dda0 2.6px, transparent 3.6px),
      radial-gradient(circle at 70% 62%, #b9dfd0 2.6px, transparent 3.6px),
      radial-gradient(circle at 88% 34%, #b9d3ee 2.6px, transparent 3.6px);
  }
  .tier.mid::after{
    background-image:
      radial-gradient(circle at 14% 55%, #f5b3c4 3px, transparent 4px),
      radial-gradient(circle at 34% 35%, #fff 3px, transparent 4px),
      radial-gradient(circle at 56% 60%, #cfbce8 3px, transparent 4px),
      radial-gradient(circle at 78% 38%, #b9dfd0 3px, transparent 4px),
      radial-gradient(circle at 93% 62%, #fff 3px, transparent 4px);
  }
  .plate{
    width:292px;height:14px;flex-shrink:0;margin-top:-3px;
    border-radius:50%;
    background:linear-gradient(180deg,#f1e6ef,#d6c6d2);
    box-shadow:0 18px 32px -20px rgba(140,100,130,.9);
  }
  .wish-msg{
    text-align:center;margin-top:30px;font-size:.92rem;
    color:var(--hot);opacity:0;transform:translateY(12px);
    transition:.8s ease;letter-spacing:.14em;text-indent:.14em;
  }
  .wish-msg.show{opacity:1;transform:none}

  .confetti{
    position:fixed;width:9px;height:9px;border-radius:2px;
    pointer-events:none;z-index:60;
  }
  .smoke{
    position:fixed;width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,180,195,.45),rgba(255,255,255,0));
    pointer-events:none;z-index:55;
  }

  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .photo{margin:0}
  .ph-inner{
    position:relative;aspect-ratio:1/1;
    border-radius:20px;overflow:hidden;
    background:linear-gradient(140deg,#fff,#fff8f4);
    border:2px solid #fff;
    box-shadow:0 14px 30px -22px rgba(160,110,140,.95),
               inset 0 0 0 1px #f7e2ea;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .42s cubic-bezier(.2,.7,.3,1), box-shadow .42s ease;
  }
  .photo:nth-child(3n+1) .ph-inner{transform:rotate(-1.2deg)}
  .photo:nth-child(3n+2) .ph-inner{transform:rotate(1deg)}
  .photo:nth-child(3n)   .ph-inner{transform:rotate(-.5deg)}
  .photo:hover .ph-inner{
    transform:rotate(0) translateY(-7px) scale(1.02);
    box-shadow:0 24px 44px -24px rgba(217,120,152,.8),
               inset 0 0 0 1px #f0ccd9;
  }
  .ph-hint{
    font-size:.76rem;line-height:2;text-align:center;
    color:#d3aebd;letter-spacing:.14em;text-indent:.14em;
  }
  .ph-hint .ic{font-size:1.4rem;display:block;margin-bottom:2px;opacity:.7}
  .ph-inner img,
  .mini-photo img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:none;z-index:1;
  }
  .ph-inner.has img,
  .mini-photo.has img{display:block}
  .ph-inner.has .ph-hint,
  .mini-photo.has .ph-hint{display:none}
  .ph-del{
    position:absolute;top:8px;right:8px;z-index:5;
    width:26px;height:26px;border-radius:50%;
    border:none;background:rgba(255,255,255,.92);
    color:var(--hot);font-size:.9rem;font-family:var(--serif);
    cursor:pointer;display:none;place-items:center;
    box-shadow:0 4px 10px rgba(160,110,140,.4);
  }
  .ph-inner.has .ph-del,
  .mini-photo.has .ph-del{display:grid}

  .cards{
    display:grid;grid-template-columns:repeat(2,1fr);gap:22px;
    max-width:720px;margin:0 auto;
  }
  .mini{
    background:#fff;border:1.5px solid #fff;border-radius:20px;
    padding:12px 12px 22px;
    box-shadow:0 16px 32px -26px rgba(160,110,140,.95),
               inset 0 0 0 1px #f7e8ef;
    transition:transform .35s ease, box-shadow .35s ease;
  }
  .mini:hover{
    transform:translateY(-5px);
    box-shadow:0 24px 40px -28px rgba(217,120,152,.8),
               inset 0 0 0 1px #f0d2de;
  }
  .mini-photo{
    position:relative;aspect-ratio:4/3;
    border-radius:14px;overflow:hidden;
    background:linear-gradient(140deg,#fff8f4,#fdf0f5);
    border:1.5px solid #fff;
    box-shadow:inset 0 0 0 1px #f7e2ea;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:box-shadow .4s ease;
  }
  .mini:hover .mini-photo{
    box-shadow:inset 0 0 0 1px #f0ccd9;
  }
  .mini p{
    padding:16px 10px 0;
    font-size:.86rem;
    line-height:2.1;
    letter-spacing:.1em;
    text-indent:.1em;
    color:#a5969d;
    text-align:center;
    font-weight:400;
    opacity:.92;
  }

  .letter{
    position:relative;max-width:640px;margin:0 auto;
    padding:52px 36px 42px;
    background:#fff;
    border:1.5px solid #fff;
    border-radius:22px;
    box-shadow:0 26px 54px -34px rgba(160,110,140,.95),
               inset 0 0 0 1px #f7e8ef;
    font-size:.98rem;line-height:2.25;
    color:var(--ink);
    white-space:pre-line;min-height:200px;
  }
  .letter::before{
    content:"";position:absolute;top:22px;left:32px;right:32px;
    height:1px;
    background:linear-gradient(90deg,#f5b3c4,#f2dda0,#b9dfd0,#cfbce8,transparent);
    opacity:.85;
  }
  .letter-body{padding-top:22px}
  .caret{
    display:inline-block;width:2px;height:1em;
    background:var(--pink);vertical-align:-2px;margin-left:2px;
    animation:blink .85s step-end infinite;
  }
  .caret.hide{display:none}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .sign{
    margin-top:26px;text-align:right;font-size:.82rem;
    color:var(--ink-soft);letter-spacing:.14em;
    opacity:0;transition:1.2s ease;
  }
  .sign.show{opacity:1}

  footer{
    position:relative;z-index:1;text-align:center;
    padding:44px 20px 64px;
    color:var(--ink-soft);font-size:.72rem;letter-spacing:.26em;
  }
  footer .heart{color:var(--hot)}

  .reveal{
    opacity:0;transform:translateY(32px);
    transition:opacity .9s ease, transform .9s cubic-bezier(.2,.7,.3,1);
  }
  .reveal.show{opacity:1;transform:none}

  /* 资源检查条 */
  #debug-bar{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(255,220,220,.96);
    color:#a03030;font-size:12px;line-height:1.6;
    padding:8px 16px;text-align:center;
    z-index:999;display:none;
    font-family:var(--serif);
    border-top:1px solid #f0b0b0;
    word-break:break-all;
  }
  #debug-bar.show{display:block}

  @media (max-width:760px){
    .section{padding:60px 18px}
    .section-sub{margin-bottom:34px}
    .gallery{grid-template-columns:repeat(2,1fr);gap:12px}
    .ph-inner{border-radius:16px}
    .cards{grid-template-columns:1fr;gap:16px}
    .mini{padding:10px 10px 18px}
    .mini p{font-size:.84rem;padding-top:13px}
    .letter{padding:44px 22px 34px;font-size:.94rem;border-radius:18px}
    .letter::before{left:22px;right:22px}
    .hero{padding:70px 18px 84px}
    .date-card{padding:10px 18px;gap:12px}
    .date-card .num{font-size:1.28rem}
  }
  @media (max-width:380px){
    .cake-wrap{transform:scale(.8);transform-origin:center top;margin-bottom:-46px}
    .hero h1{letter-spacing:.08em;text-indent:.08em}
    .music-btn{width:44px;height:44px;top:12px;right:12px}
  }
</style>
</head>
<body>

<canvas id="floaters"></canvas>
<button class="music-btn" id="musicBtn" title="播放背景音乐">♪</button>
<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

<section class="hero">
  <p class="badge">HAPPY BIRTHDAY</p>
  <h1>生日快乐</h1>
  <p class="sub">致 徐静 · <b>22</b> 岁</p>
  <div class="date-card">
    <span class="num">十一月八日</span>
    <span class="wk" id="weekText">星期六</span>
  </div>
  <div class="scroll-hint">↓</div>
</section>

<section class="section reveal">
  <h2 class="section-title"><span class="deco">❁</span>烛前小愿</h2>
  <p class="section-sub">点一下蛋糕，闭上眼睛</p>
  <div class="rule"></div>
  <div class="cake-wrap">
    <div class="cake" id="cake">
      <div class="candles" id="candles"></div>
      <div class="tier top"></div>
      <div class="tier mid"></div>
      <div class="tier bottom"></div>
      <div class="plate"></div>
    </div>
  </div>
  <p class="wish-msg" id="wishMsg">愿望已经悄悄许好啦，一定会实现的</p>
</section>

<section class="section reveal">
  <h2 class="section-title"><span class="deco">❁</span>影事</h2>
  <p class="section-sub">帧帧如晤，光落在旧日的纸上</p>
  <div class="rule"></div>
  <div class="gallery" id="gallery">
    <!-- 图片直接放在根目录，与 index.html 同级 -->
    <figure class="photo">
      <div class="ph-inner">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="1.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
    </figure>
    <figure class="photo">
      <div class="ph-inner">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="2.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
    </figure>
    <figure class="photo">
      <div class="ph-inner">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="3.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
    </figure>
    <figure class="photo">
      <div class="ph-inner">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="4.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
    </figure>
    <figure class="photo">
      <div class="ph-inner">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="5.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
    </figure>
    <figure class="photo">
      <div class="ph-inner">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="6.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
    </figure>
  </div>
</section>

<section class="section reveal">
  <h2 class="section-title"><span class="deco">❁</span>琐忆</h2>
  <p class="section-sub">拣几枚旧日的碎片，钉在这里</p>
  <div class="rule"></div>
  <div class="cards">
    <div class="mini">
      <div class="mini-photo">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="m1.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
      <p>光落下来的时候，日子悄悄有了形状。</p>
    </div>
    <div class="mini">
      <div class="mini-photo">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="m2.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
      <p>风经过这里，替我们记住了一些声音。</p>
    </div>
    <div class="mini">
      <div class="mini-photo">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="m3.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
      <p>云在很远的地方，影子在很近的地方。</p>
    </div>
    <div class="mini">
      <div class="mini-photo">
        <span class="ph-hint"><span class="ic">🖼</span>点击添加</span>
        <img alt="" data-src="m4.jpg">
        <button class="ph-del" title="移除">×</button>
      </div>
      <p>时间走得很轻，轻得能停在一张纸上。</p>
    </div>
  </div>
</section>

<section class="section reveal">
  <h2 class="section-title"><span class="deco">❁</span>见字如面</h2>
  <p class="section-sub">一封慢慢写给你的信</p>
  <div class="rule"></div>
  <div class="letter">
    <div class="letter-body">
      <span id="letterText"></span><span class="caret" id="caret"></span>
    </div>
    <p class="sign" id="sign">十一月八日</p>
  </div>
</section>

<footer>
  MADE WITH <span class="heart">♥</span> FOR YOU
</footer>

<script>
/* ========== 1. 飘浮的小星星 ========== */
(function(){
  const canvas = document.getElementById('floaters');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  const COLORS = ['#f5b3c4','#f2dda0','#b9dfd0','#b9d3ee','#cfbce8','#f0a3bc'];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  function starPath(s){
    ctx.beginPath();
    for (let i = 0; i < 5; i++){
      const a1 = -Math.PI / 2 + i * 2 * Math.PI / 5;
      const a2 = a1 + Math.PI / 5;
      ctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      ctx.lineTo(Math.cos(a2) * s * 0.44, Math.sin(a2) * s * 0.44);
    }
    ctx.closePath();
  }
  function heartPath(s){
    ctx.beginPath();
    ctx.moveTo(0, s * 0.55);
    ctx.bezierCurveTo(-s * 0.95, -s * 0.12, -s * 0.55, -s * 0.98, 0, -s * 0.4);
    ctx.bezierCurveTo( s * 0.55, -s * 0.98,  s * 0.95, -s * 0.12, 0, s * 0.55);
    ctx.closePath();
  }

  function make(first){
    return {
      x: Math.random() * W,
      y: first ? Math.random() * H : -40,
      s: 5 + Math.random() * 9,
      vy: 0.28 + Math.random() * 0.6,
      drift: Math.random() * Math.PI * 2,
      dspeed: 0.007 + Math.random() * 0.014,
      amp: 0.3 + Math.random() * 0.6,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.02,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      alpha: 0.2 + Math.random() * 0.28,
      kind: Math.random() < 0.42 ? 'star' : (Math.random() < 0.5 ? 'heart' : 'dot')
    };
  }

  const items = [];
  const COUNT = window.innerWidth < 640 ? 20 : 34;
  for (let i = 0; i < COUNT; i++) items.push(make(true));

  function tick(){
    ctx.clearRect(0, 0, W, H);
    for (const p of items){
      p.drift += p.dspeed;
      p.x += Math.sin(p.drift) * p.amp;
      p.y += p.vy;
      p.rot += p.vr;

      if (p.x < -60) p.x = W + 60;
      if (p.x > W + 60) p.x = -60;
      if (p.y > H + 50) Object.assign(p, make(false));

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      if (p.kind === 'star'){ starPath(p.s); ctx.fill(); }
      else if (p.kind === 'heart'){ heartPath(p.s); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.s * 0.42, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ========== 3. 蛋糕与蜡烛 ========== */
(function(){
  const candles = document.getElementById('candles');
  const cake = document.getElementById('cake');
  const wishMsg = document.getElementById('wishMsg');
  const CANDLE_COUNT = 6;
  let blown = false;

  candles.innerHTML = Array.from({length: CANDLE_COUNT}, function(){
    return '<div class="candle"><span class="flame"></span></div>';
  }).join('');

  function smoke(el){
    const r = el.getBoundingClientRect();
    for (let i = 0; i < 6; i++){
      const p = document.createElement('div');
      p.className = 'smoke';
      p.style.left = (r.left + r.width / 2) + 'px';
      p.style.top = r.top + 'px';
      document.body.appendChild(p);
      const dx = (Math.random() - 0.5) * 46;
      const dy = -70 - Math.random() * 70;
      p.animate([
        {transform: 'translate(-50%,0) scale(.6)', opacity: .5},
        {transform: 'translate(calc(-50% + ' + dx + 'px), ' + dy + 'px) scale(2)', opacity: 0}
      ], {duration: 1200 + Math.random() * 700, easing: 'ease-out'});
      setTimeout(function(){ p.remove(); }, 2000);
    }
  }

  function burst(){
    const r = cake.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const colors = ['#f5b3c4','#f2dda0','#b9dfd0','#b9d3ee','#cfbce8','#ffffff'];

    for (let i = 0; i < 90; i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.background = colors[i % colors.length];
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      if (i % 3 === 0) el.style.borderRadius = '50%';
      document.body.appendChild(el);

      const ang = Math.random() * Math.PI * 2;
      const dist = 90 + Math.random() * 300;
      const x = Math.cos(ang) * dist;
      const y = Math.sin(ang) * dist * 0.85 + 180;

      el.animate([
        {transform: 'translate(-50%,-50%) rotate(0deg)', opacity: 1},
        {transform: 'translate(calc(-50% + ' + x + 'px), calc(-50% + ' + y + 'px)) rotate(' + (Math.random()*900-450) + 'deg)', opacity: 0}
      ], {
        duration: 1300 + Math.random() * 900,
        easing: 'cubic-bezier(.15,.65,.35,1)'
      });
      setTimeout(function(){ el.remove(); }, 2400);
    }
  }

  cake.addEventListener('click', function(){
    if (blown) return;
    blown = true;

    document.querySelectorAll('.flame').forEach(function(f, i){
      setTimeout(function(){
        f.classList.add('out');
        smoke(f);
      }, i * 110);
    });

    setTimeout(function(){
      burst();
      wishMsg.classList.add('show');
    }, 720);
  });
})();

/* ========== 4. 滚动出现 ========== */
(function(){
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){
        e.target.classList.add('show');
        io.unobserve(e.target);
      }
    });
  }, {threshold: 0.1});
  els.forEach(function(el){ io.observe(el); });
})();

/* ========== 5. 图片加载 + 失败检测 ========== */
(function(){
  const KEY = 'hb_photo_';
  const cells = document.querySelectorAll('#gallery .ph-inner, .mini-photo');
  const missing = []; // 记录加载失败的文件名

  function compress(file, maxSide, quality){
    return new Promise(function(resolve, reject){
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(e){
        const img = new Image();
        img.onerror = reject;
        img.onload = function(){
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxSide / Math.max(w, h));
          w = Math.round(w * scale);
          h = Math.round(h * scale);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function show(cell, src, name){
    const img = cell.querySelector('img');
    img.onload = function(){ cell.classList.add('has'); };
    img.onerror = function(){
      img.removeAttribute('src');
      cell.classList.remove('has');
      if (name && missing.indexOf(name) === -1) missing.push(name);
      updateDebugBar();
    };
    img.src = src;
  }

  cells.forEach(function(cell, i){
    const img = cell.querySelector('img');
    const ds = img.getAttribute('data-src');
    let saved = null;
    try { saved = localStorage.getItem(KEY + i); } catch(e){}

    if (saved){
      show(cell, saved);
    } else if (ds && ds.trim() !== ''){
      show(cell, ds, ds);
    }

    cell.addEventListener('click', function(e){
      if (e.target.classList.contains('ph-del')) return;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async function(){
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const dataUrl = await compress(file, 900, 0.82);
          show(cell, dataUrl);
          try { localStorage.setItem(KEY + i, dataUrl); } catch(err){}
        } catch(err){
          alert('这张图片读取失败了，换一张试试');
        }
      };
      input.click();
    });

    cell.querySelector('.ph-del').addEventListener('click', function(e){
      e.stopPropagation();
      try { localStorage.removeItem(KEY + i); } catch(err){}
      const img = cell.querySelector('img');
      if (ds && ds.trim() !== ''){
        show(cell, ds, ds);
      } else {
        img.removeAttribute('src');
        cell.classList.remove('has');
      }
    });
  });

  /* 音乐检测 */
  const audio = document.getElementById('bgm');
  let audioMissing = false;
  audio.addEventListener('error', function(){
    if (!audioMissing){
      audioMissing = true;
      if (missing.indexOf('bgm.mp3') === -1) missing.push('bgm.mp3');
      updateDebugBar();
    }
  });

  /* 调试条 */
  const bar = document.getElementById('debug-bar');
  function updateDebugBar(){
    if (missing.length === 0){
      bar.classList.remove('show');
      bar.textContent = '';
    } else {
      bar.classList.add('show');
      bar.textContent = '⚠️ 以下文件未找到，请确保它们与 index.html 放在同一文件夹：' + missing.join('、');
    }
  }
})();

/* ========== 6. 打字机信件 ========== */
(function(){
  const text =
'展信安。\n' +
'恭喜徐静同学，抵达二十二岁。愿这一岁，你平安自在，心有所向，事有所成。那些你默默期许的，慢慢都有回响。\n' +
'我们隔着一段距离各自生长，好好生活，静待相逢。\n' +
'岁岁无忧，得偿所愿。';

  const target = document.getElementById('letterText');
  const caret = document.getElementById('caret');
  const sign = document.getElementById('sign');
  const section = target.closest('.section');
  let started = false;

  function start(){
    if (started) return;
    started = true;
    let i = 0;
    const timer = setInterval(function(){
      target.textContent = text.slice(0, ++i);
      if (i >= text.length){
        clearInterval(timer);
        setTimeout(function(){ caret.classList.add('hide'); }, 1600);
        setTimeout(function(){ sign.classList.add('show'); }, 400);
      }
    }, 45);
  }

  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){ start(); io.disconnect(); }
    });
  }, {threshold: 0.25});
  io.observe(section);
})();

/* ========== 7. 背景音乐：优先 bgm.mp3，失败则合成生日歌 ========== */
(function(){
  const btn = document.getElementById('musicBtn');
  const audio = document.getElementById('bgm');
  const VOLUME = 0.55;
  audio.volume = VOLUME;

  /* ---- 备用：合成生日歌 ---- */
  const NOTE = {
    G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25,
    F5: 698.46, G5: 783.99
  };
  const MELODY = [
    ['G4',.5],['G4',.5],['A4',1],['G4',1],['C5',1],['B4',1.6],
    ['G4',.5],['G4',.5],['A4',1],['G4',1],['D5',1],['C5',1.6],
    ['G4',.5],['G4',.5],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1.8],
    ['F5',.5],['F5',.5],['E5',1],['C5',1],['D5',1],['C5',2.2]
  ];
  const BEAT = 0.42;

  let ctx = null, synthOn = false, loopTimer = null;

  function playOnce(){
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();

    let t = ctx.currentTime + 0.12;
    const startTime = t;

    MELODY.forEach(function(item){
      const name = item[0], beats = item[1];
      const dur = beats * BEAT;
      const freq = NOTE[name];

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.15, t + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur);

      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.value = freq * 2;
      gain2.gain.setValueAtTime(0.0001, t);
      gain2.gain.linearRampToValueAtTime(0.032, t + 0.03);
      gain2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.8);
      osc2.connect(gain2).connect(ctx.destination);
      osc2.start(t);
      osc2.stop(t + dur);

      t += dur;
    });

    return t - startTime;
  }

  function loopSynth(){
    if (!synthOn) return;
    const dur = playOnce();
    loopTimer = setTimeout(loopSynth, dur * 1000 + 500);
  }

  function startSynth(){
    stopSynth();
    synthOn = true;
    loopSynth();
  }

  function stopSynth(){
    synthOn = false;
    clearTimeout(loopTimer);
    if (ctx && ctx.state === 'running') ctx.suspend();
  }

  let playing = false;

  btn.addEventListener('click', function(){
    if (!playing){
      playing = true;
      btn.classList.add('on');
      btn.textContent = '♫';

      stopSynth();
      try { audio.currentTime = 0; } catch(e){}

      const p = audio.play();
      if (p && p.catch){
        p.catch(function(){ startSynth(); });
      }
    } else {
      playing = false;
      btn.classList.remove('on');
      btn.textContent = '♪';
      try { audio.pause(); } catch(e){}
      stopSynth();
    }
  });
})();
</script>
